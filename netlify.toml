# NOTE: vercel.json carries each legacy redirect twice, with and without a
# trailing slash, because Vercel's trailingSlash:true normalises the URL
# before matching and a bare source never fires. Netlify matches both forms
# already, so the twins differ here on purpose.

[[redirects]]
  from = "/.github/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.githooks/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitleaksignore"
  to = "/404.html"
  status = 404
  force = true

# First-email templates ship inside the lead function (brief 07); never served.
