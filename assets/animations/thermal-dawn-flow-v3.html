<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Thermal Dawn — Live System v3</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500;600&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
/* ── Thermal Dawn mode palette — MUST match the HA theme (--td-*) and the web app:
     charge #FF8C1A · discharge #2EC68A · direct #E3654F · idle #6B7684 ── */
:root {
  --bg: #0a0a0a;
  --charge: #FF8C1A; --discharge: #2EC68A; --direct: #E3654F;
  --tag: rgba(255,255,255,0.45); --val: rgba(255,255,255,0.85); --rule: rgba(255,255,255,0.18);
}
html, body { background: var(--bg); margin: 0; padding: 0; height: 100%; overflow: hidden; }
body { display: flex; align-items: center; justify-content: center; height: 100%; }
.svg-wrap { width: 100%; max-width: 558px; }
svg { display: block; width: 100%; height: auto; overflow: hidden; }

@keyframes pulse-flow {
  0%   { stroke-dashoffset: 200; opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { stroke-dashoffset: 0; opacity: 0; }
}
@keyframes glow-pulse  { 0%,100%{opacity:0.4} 50%{opacity:1} }
@keyframes window-glow { 0%,100%{fill:rgba(255,140,26,0.08)} 50%{fill:rgba(255,140,26,0.28)} }
@keyframes fan-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes rim-breathe { 0%,100%{opacity:0.55} 50%{opacity:0.85} }

.flow-line { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2.5; stroke-dasharray: 8 6; animation: pulse-flow 2.2s ease-in-out infinite; }
.flow-delay-1 { animation-delay: 0.4s; }
.flow-delay-2 { animation-delay: 0.8s; }
.flow-delay-3 { animation-delay: 1.2s; }
.flow-delay-4 { animation-delay: 1.6s; }
.glow-dot { animation: glow-pulse 1.8s ease-in-out infinite; }
/* Windows are a STATE, not decoration: they glow only when the house is
   actually being fed, and only when it is dark enough to read as light from
   inside. Left ungated they implied a heated house at midday in Idle. */
/* Remove the animation entirely rather than pausing it: a paused animation
   freezes the fill at whatever keyframe it stopped on (measured at 0.25 —
   near peak), so the windows stayed lit in daylight. With no animation the
   base fill applies and the transition fades them out. */
.window    { fill: rgba(255,140,26,0.03); transition: fill 1.2s ease; }
body.house-warm .window { animation: window-glow 3s ease-in-out infinite; }
.fan-blades { animation: fan-spin 1.6s linear infinite; transform-box: fill-box; transform-origin: center; }
.fan-blades.off { animation: none; }
.store-rim { animation: rim-breathe 4s ease-in-out infinite; }

/* tags stay DM Mono (technical accent); values match the app's Montserrat */
.tag  { font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.16em; fill: var(--tag); text-transform: uppercase; }
.val  { font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 600; fill: var(--val); }
.temp { font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 500; fill: rgba(255,255,255,0.55); }
.temp.muted { fill: rgba(255,255,255,0.2); }
.rule { stroke: var(--rule); stroke-width: 1; fill: none; }
.dot  { fill: rgba(255,255,255,0.5); }

/* ── weather / sky layers ─────────────────────────────────────────── */
.sky-fade { transition: opacity 1.2s ease; }
@keyframes cloud-drift { from { transform: translateX(-16px); } to { transform: translateX(16px); } }
.cloud-move { animation: cloud-drift 46s ease-in-out infinite alternate; }
.cloud-move.c2 { animation-duration: 62s; animation-delay: -10s; }
.cloud-move.c3 { animation-duration: 54s; animation-delay: -26s; }
@keyframes cloud-wobble { 0%,100%{ transform: translateY(0) rotate(0deg); } 50%{ transform: translateY(3.5px) rotate(0.5deg); } }
.cloud-wobble { transform-box: fill-box; transform-origin: 50% 50%; animation: cloud-wobble 8s ease-in-out infinite; }
.cloud-wobble.w2 { animation-duration: 11s; animation-delay: -3.5s; }

@keyframes rain-fall {
  0%   { transform: translateY(-40px); opacity: 0; }
  8%   { opacity: 1; }
  82%  { opacity: 1; }
  100% { transform: translateY(420px); opacity: 0; }
}
.raindrop { animation: rain-fall 0.9s linear infinite; }

@keyframes twinkle { 0%,100%{opacity:0.25} 50%{opacity:0.95} }
.star { animation: twinkle 3.6s ease-in-out infinite; }

@keyframes lightning { 0%,92%,100%{opacity:0} 93%{opacity:0.8} 94%{opacity:0.05} 95%{opacity:0.55} 96%{opacity:0} }
.lightning-flash { animation: lightning 9s linear infinite; }

/* Edge light: near-black geometry is read from its EDGES, not its faces.
   Silhouettes only - never a window, slat or interior detail, or the scene
   turns into a wireframe. */
:root { --edge: rgba(255,255,255,0.20); --edge-soft: rgba(255,255,255,0.13); }
.edge-line { fill: none; stroke-linecap: round; transition: opacity 1.2s ease; }
.edge-line line, line.edge-line { vector-effect: non-scaling-stroke; }
body.is-night .edge-line { opacity: 0.6; }   /* moonlit edges sit dimmer than sunlit */

.hide { display: none !important; }

/* ── test control panel — hidden unless ?test=1 ───────────────────── */
#test-panel {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: none; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: center;
  padding: 10px 12px; background: rgba(8,8,10,0.92); border-top: 1px solid rgba(255,255,255,0.08);
  font-family: 'DM Mono', monospace;
}
body.testing #test-panel { display: flex; }
#test-panel .grp { display: flex; align-items: center; gap: 6px; }
#test-panel .grp > span.lbl { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-right: 2px; }
#test-panel button {
  font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; padding: 6px 10px; border-radius: 6px; cursor: pointer;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.7); transition: all 0.15s;
}
#test-panel button:hover { filter: brightness(1.3); }
#test-panel button.active { background: rgba(255,140,26,0.18); border-color: rgba(255,140,26,0.6); color: #FF8C1A; }
#test-panel #temp-readout { font-size: 12px; color: rgba(255,255,255,0.85); min-width: 52px; text-align: center; }
#test-panel input[type=range] { accent-color: #FF8C1A; }
#test-panel .knob { width: 90px; vertical-align: middle; }
</style>
</head>

<script>
(function() {
  'use strict';

  // ════════════════════════════════════════════════════════════════════
  //  CAMERA + WORLD MODEL for the plant (store / HP / battery)
  //  Ground axes from the authored scene: u = depth (down-right),
  //  v = frontage (up-right). tilt scales uy/vy; rise scales heights.
  //  tilt=1, rise=1 reproduces the hand-drawn geometry exactly.
  // ════════════════════════════════════════════════════════════════════
  var params = new URLSearchParams(window.location.search);
  // Default camera (signed off 2026-07-10): tilt 0.85 aligns the plant's
  // ground plane with the backdrop squash; rise 0.90 sits the verticals
  // between the old crushed look (0.85) and fully true (1.0).
  var PROJ = {
    ux: 28, uy: 16,
    vx: 57, vy: -31,
    tilt: parseFloat(params.get('tilt')) || 0.85,
    rise: parseFloat(params.get('rise')) || 0.9
  };
  function px(n) { return +n.toFixed(1); }
  // Project (a·u, b·v, z·up) from a screen-space ground anchor.
  function P(ax, ay, a, b, z) {
    return [px(ax + a * PROJ.ux + b * PROJ.vx),
            px(ay + a * PROJ.uy * PROJ.tilt + b * PROJ.vy * PROJ.tilt - z * PROJ.rise)];
  }
  function pts(list) { return list.map(function (p) { return p[0] + ',' + p[1]; }).join(' '); }

  // World definitions (dims in authored px at rise=1).
  // STORE: +9 taller than the authored 81 (the hero unit reads premium tall).
  // Anchor ay values are the authored ground positions mapped through the
  // backdrop squash (y' = 400 + 0.85·(y − 400) in equip-local space), since
  // the plant renders OUTSIDE the squash wrapper but must sit on the same
  // (squashed) ground line.
  // SQ maps authored ground positions through the backdrop squash, whose
  // scale IS the tilt knob (applyCamera drives both), so house and plant
  // share one ground plane at any tilt. Pivot 400 = the squash's ground
  // line expressed in equip-local space.
  var SQ = function (y) { return 400 + PROJ.tilt * (y - 400); };
  var STORE = { ax: 495, ayRaw: 331, D: 1.0, L: 0.815, H: 90, BAND: 20, sideSlats: 4, frontSlats: 7 };
  var HP    = { ax: 404, ayRaw: 382, D: 0.607, L: 0.754, H: 58 };
  var BATT  = { ax: 599, ayRaw: 272.5, D: 0.6, L: 0.544, H: 49 };
  // (store anchor = authored 461,350 + its old translate(34,-19);
  //  battery anchor = 557,296 + translate(42,-23.5) — groups are gone in v3.)

  function buildPlant() {
    var s = '';
    var S = STORE, Hp = HP, B = BATT;
    S.ay = SQ(S.ayRaw); Hp.ay = SQ(Hp.ayRaw); B.ay = SQ(B.ayRaw);

    // ── LITHIUM BATTERY ────────────────────────────────────────────────
    var b0 = [B.ax, B.ay];
    s += '<g>';
    s += '<polygon points="' + pts([P(b0[0],b0[1],0,0,0), P(b0[0],b0[1],1*B.D/B.D*0+0,0,0)[0] ? P(b0[0],b0[1],B.D,0,0) : P(b0[0],b0[1],B.D,0,0), P(b0[0],b0[1],B.D,0,B.H), P(b0[0],b0[1],0,0,B.H)]) + '" fill="url(#batt-side)" stroke="#6f757d" stroke-width="0.5"/>';
    s += '<polygon points="' + pts([P(b0[0],b0[1],0,0,B.H), P(b0[0],b0[1],0,B.L,B.H), P(b0[0],b0[1],B.D,B.L,B.H), P(b0[0],b0[1],B.D,0,B.H)]) + '" fill="url(#batt-top)" stroke="#79808a" stroke-width="0.5"/>';
    s += '<polygon points="' + pts([P(b0[0],b0[1],B.D,0,0), P(b0[0],b0[1],B.D,B.L,0), P(b0[0],b0[1],B.D,B.L,B.H), P(b0[0],b0[1],B.D,0,B.H)]) + '" fill="url(#batt-front)" stroke="#72787f" stroke-width="0.5"/>';
    s += '<g stroke="#9aa0a9" stroke-width="0.6" opacity="0.7">';
    [0.245, 0.49, 0.735].forEach(function (f) {
      var z = B.H * f;
      s += '<line x1="' + P(b0[0],b0[1],B.D,0,z)[0] + '" y1="' + P(b0[0],b0[1],B.D,0,z)[1] + '" x2="' + P(b0[0],b0[1],B.D,B.L,z)[0] + '" y2="' + P(b0[0],b0[1],B.D,B.L,z)[1] + '"/>';
    });
    s += '</g></g>';

    // ── THERMAL STORE (the hero) ───────────────────────────────────────
    var a = [S.ax, S.ay];
    var slatTop = S.H - S.BAND;
    var glowC = P(a[0],a[1], 0.6, S.L/2, S.H*0.45);
    s += '<g>';
    s += '<ellipse id="store-glow-el" cx="' + glowC[0] + '" cy="' + glowC[1] + '" rx="48" ry="' + px(S.H*0.95) + '" fill="url(#store-glow-c)" opacity="0"/>';
    // left side: silver band + slat body + slat lines
    s += '<polygon points="' + pts([P(a[0],a[1],0,0,S.H), P(a[0],a[1],S.D,0,S.H), P(a[0],a[1],S.D,0,slatTop), P(a[0],a[1],0,0,slatTop)]) + '" fill="url(#steel-side)" stroke="#3a3d43" stroke-width="0.3"/>';
    s += '<polygon points="' + pts([P(a[0],a[1],0,0,slatTop), P(a[0],a[1],S.D,0,slatTop), P(a[0],a[1],S.D,0,0), P(a[0],a[1],0,0,0)]) + '" fill="url(#slat-side-grad)" stroke="#2a2a2c" stroke-width="0.4"/>';
    s += '<g stroke="#050505" stroke-width="0.6" opacity="0.85">';
    for (var i = 1; i <= S.sideSlats; i++) {
      var f = i / (S.sideSlats + 1);
      var t = P(a[0],a[1], f*S.D, 0, slatTop - 3), b = P(a[0],a[1], f*S.D, 0, 2);
      s += '<line x1="' + t[0] + '" y1="' + t[1] + '" x2="' + b[0] + '" y2="' + b[1] + '"/>';
    }
    s += '</g>';
    // top face + front silver band
    s += '<polygon points="' + pts([P(a[0],a[1],0,0,S.H), P(a[0],a[1],0,S.L,S.H), P(a[0],a[1],S.D,S.L,S.H), P(a[0],a[1],S.D,0,S.H)]) + '" fill="url(#steel-top)" stroke="#3a3d43" stroke-width="0.4"/>';
    var stE1 = P(a[0],a[1],S.D,0,S.H), stE2 = P(a[0],a[1],S.D,S.L,S.H);
    s += '<line class="edge-line" x1="' + stE1[0] + '" y1="' + stE1[1] + '" x2="' + stE2[0] + '" y2="' + stE2[1] + '" stroke="var(--edge)" stroke-width="1"/>';
    s += '<polygon points="' + pts([P(a[0],a[1],S.D,0,S.H), P(a[0],a[1],S.D,S.L,S.H), P(a[0],a[1],S.D,S.L,slatTop), P(a[0],a[1],S.D,0,slatTop)]) + '" fill="url(#steel-grad)" stroke="#3a3d43" stroke-width="0.4"/>';
    // brand text on the band (sheared onto the frontage plane)
    var slope = (PROJ.vy * PROJ.tilt) / PROJ.vx;
    var mid = P(a[0],a[1], S.D, S.L/2, S.H - 11);
    var ty = px(mid[1] - slope * mid[0]);
    s += '<text x="' + mid[0] + '" y="0" text-anchor="middle" font-family="DM Mono,monospace" font-size="4.8" font-weight="700" fill="#1a1c20" letter-spacing="0.6" transform="matrix(1,' + slope.toFixed(4) + ',0,1,0,' + ty + ')">THERMAL DAWN</text>';
    // band bottom highlight
    s += '<polygon points="' + pts([P(a[0],a[1],S.D,0.035*S.L,slatTop-2), P(a[0],a[1],S.D,0.978*S.L,slatTop-2), P(a[0],a[1],S.D,0.978*S.L,slatTop-4), P(a[0],a[1],S.D,0.035*S.L,slatTop-4)]) + '" fill="#a8acb4" opacity="0.35"/>';
    // front slat body + slat lines
    s += '<polygon points="' + pts([P(a[0],a[1],S.D,0,slatTop), P(a[0],a[1],S.D,S.L,slatTop), P(a[0],a[1],S.D,S.L,0), P(a[0],a[1],S.D,0,0)]) + '" fill="url(#slat-grad)" stroke="#000" stroke-width="0.4"/>';
    s += '<g stroke="#000" stroke-width="0.9" opacity="0.85">';
    for (var j = 1; j <= S.frontSlats; j++) {
      var g = j / (S.frontSlats + 1);
      var t2 = P(a[0],a[1], S.D, g*S.L, slatTop - 3), b2 = P(a[0],a[1], S.D, g*S.L, 3);
      s += '<line x1="' + t2[0] + '" y1="' + t2[1] + '" x2="' + b2[0] + '" y2="' + b2[1] + '"/>';
    }
    s += '</g>';
    // brand-orange rim light down the front-left corner edge
    var rt = P(a[0],a[1], S.D, 0, S.H), rb = P(a[0],a[1], S.D, 0, 0);
    s += '<line class="store-rim" x1="' + rt[0] + '" y1="' + (rt[1]+1) + '" x2="' + rb[0] + '" y2="' + rb[1] + '" stroke="#FF8C1A" stroke-width="1.1" stroke-linecap="round" filter="url(#rim-glow)"/>';
    s += '</g>';

    // ── PORT ROW on the silver band (left end) + house risers ─────────
    // Riser feet sit ON the garage seam line (699,217)→(390,390) — mapped
    // through the backdrop squash, since the seam renders squashed while
    // the plant does not. Derived from the line equation so the feet stay
    // planted whatever the camera does.
    function seamYRaw(x) { return 217 + (699 - x) * (390 - 217) / (699 - 390); }
    function seamY(x) { return px(SQ(seamYRaw(x))); }
    var ports = [];
    for (var k = 0; k < 4; k++) ports.push(P(a[0],a[1], 0.125 + 0.25*k, 0, S.H - 10));
    var housePort = ports[2], retPort = ports[3];
    var hs1 = [px(housePort[0] - 0.535*PROJ.vx), px(housePort[1] - 0.535*PROJ.vy*PROJ.tilt)];
    var dHouse = 'M' + housePort.join(',') + ' L' + hs1.join(',') + ' L' + hs1[0] + ',' + seamY(hs1[0]) + ' L390,' + px(SQ(390));
    var rs1 = [px(retPort[0] - 0.553*PROJ.vx), px(retPort[1] - 0.553*PROJ.vy*PROJ.tilt)];
    var dReturn = 'M' + rs1[0] + ',' + seamY(rs1[0]) + ' L' + rs1.join(',') + ' L' + retPort.join(',');
    s += '<g>';
    s += '<path fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" d="' + dHouse + '"/>';
    s += '<path fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" d="' + dReturn + '"/>';
    ports.forEach(function (p) {
      s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="1.8" fill="#0a0a0a" stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/>';
    });
    s += '</g>';
    // flow overlay for the port-side house legs
    s += '<g id="g-flow-home-2" style="opacity:0">';
    s += '<path class="flow-line" style="stroke:var(--flow-main)" d="' + dHouse + '"/>';
    s += '<path class="flow-line flow-delay-3" style="stroke:var(--flow-main)" d="' + dReturn + '"/>';
    s += '</g>';

    // ── HEAT PUMP ──────────────────────────────────────────────────────
    var h0 = [Hp.ax, Hp.ay];
    s += '<g>';
    s += '<polygon points="' + pts([P(h0[0],h0[1],0,0,0), P(h0[0],h0[1],Hp.D,0,0), P(h0[0],h0[1],Hp.D,0,Hp.H), P(h0[0],h0[1],0,0,Hp.H)]) + '" fill="url(#hp-side-grad)" stroke="#3a3a3c" stroke-width="0.5"/>';
    s += '<g stroke="#0a0a0a" stroke-width="0.5" opacity="0.85">';
    for (var m = 0; m < 7; m++) {
      var z1 = Hp.H - 10 - m * 8;
      var l1 = P(h0[0],h0[1], 0.235, 0, z1), l2 = P(h0[0],h0[1], 0.82, 0, z1 - 2);
      s += '<line x1="' + l1[0] + '" y1="' + l1[1] + '" x2="' + l2[0] + '" y2="' + l2[1] + '"/>';
    }
    s += '</g>';
    s += '<polygon points="' + pts([P(h0[0],h0[1],0,0,Hp.H), P(h0[0],h0[1],0,Hp.L,Hp.H), P(h0[0],h0[1],Hp.D,Hp.L,Hp.H), P(h0[0],h0[1],Hp.D,0,Hp.H)]) + '" fill="url(#hp-top-grad)" stroke="#1a1a1a" stroke-width="0.4"/>';
    var hpE1 = P(h0[0],h0[1],Hp.D,0,Hp.H), hpE2 = P(h0[0],h0[1],Hp.D,Hp.L,Hp.H);
    s += '<line class="edge-line" x1="' + hpE1[0] + '" y1="' + hpE1[1] + '" x2="' + hpE2[0] + '" y2="' + hpE2[1] + '" stroke="var(--edge)" stroke-width="1"/>';
    var faceStr = pts([P(h0[0],h0[1],Hp.D,0,0), P(h0[0],h0[1],Hp.D,Hp.L,0), P(h0[0],h0[1],Hp.D,Hp.L,Hp.H), P(h0[0],h0[1],Hp.D,0,Hp.H)]);
    s += '<polygon points="' + faceStr + '" fill="url(#hp-front-grad)" stroke="#1a1a1a" stroke-width="0.5"/>';
    // fans sheared onto the frontage plane (centres at z = H−15 / H−44)
    var fx = px(P(h0[0],h0[1], Hp.D, Hp.L/2, 0)[0]);
    var fanTopY = px(P(h0[0],h0[1], Hp.D, Hp.L/2, Hp.H - 15)[1] - slope * fx);
    var fanBotY = px(P(h0[0],h0[1], Hp.D, Hp.L/2, Hp.H - 44)[1] - slope * fx);
    s += '<g transform="matrix(1,' + slope.toFixed(4) + ',0,1,0,0)">';
    [[fanTopY, 'hp-fan-1', 'hp-ring-1', ''], [fanBotY, 'hp-fan-2', 'hp-ring-2', 'animation-delay:-0.5s']].forEach(function (fan, idx) {
      var cy = fan[0];
      s += '<g>';
      s += '<circle cx="' + fx + '" cy="' + cy + '" r="10" fill="#0a0a0a" stroke="#3a3a3c" stroke-width="0.7"/>';
      s += '<circle cx="' + fx + '" cy="' + cy + '" r="9" fill="#050505"/>';
      s += '<g id="' + fan[1] + '" class="fan-blades"' + (fan[3] ? ' style="' + fan[3] + '"' : '') + '>';
      s += '<path d="M' + fx + ',' + px(cy-8) + ' Q' + px(fx+5) + ',' + px(cy-5) + ' ' + px(fx+3) + ',' + cy + ' Q' + fx + ',' + px(cy-2) + ' ' + fx + ',' + px(cy-8) + ' Z" fill="#1a1a1a"/>';
      s += '<path d="M' + fx + ',' + px(cy+8) + ' Q' + px(fx-5) + ',' + px(cy+5) + ' ' + px(fx-3) + ',' + cy + ' Q' + fx + ',' + px(cy+2) + ' ' + fx + ',' + px(cy+8) + ' Z" fill="#1a1a1a"/>';
      s += '<path d="M' + px(fx-8) + ',' + px(cy+1) + ' Q' + px(fx-5) + ',' + px(cy-4) + ' ' + fx + ',' + px(cy-1) + ' Q' + px(fx-3) + ',' + px(cy+3) + ' ' + px(fx-8) + ',' + px(cy+1) + ' Z" fill="#1a1a1a"/>';
      s += '<path d="M' + px(fx+8) + ',' + px(cy-1) + ' Q' + px(fx+5) + ',' + px(cy+4) + ' ' + fx + ',' + px(cy+1) + ' Q' + px(fx+3) + ',' + px(cy-3) + ' ' + px(fx+8) + ',' + px(cy-1) + ' Z" fill="#1a1a1a"/>';
      s += '</g>';
      s += '<circle cx="' + fx + '" cy="' + cy + '" r="1.6" fill="#2a2a2a" stroke="#444" stroke-width="0.3"/>';
      s += '<circle id="' + fan[2] + '" cx="' + fx + '" cy="' + cy + '" r="11.5" fill="none" stroke="#FF8C1A" stroke-width="1.2" opacity="0.75" style="animation:glow-pulse 1s ease-in-out infinite' + (idx ? ' 0.5s' : '') + '"/>';
      s += '</g>';
    });
    s += '</g>';
    s += '<g id="hp-off-overlay" style="opacity:0"><polygon points="' + faceStr + '" fill="#0a0a0a" opacity="0.72"/></g>';
    s += '</g>';

    // ── HP ⇄ STORE pipework + flow pair ────────────────────────────────
    // Supply/return stubs exit the HP's RIGHT face (v = L) near the top;
    // each dogleg runs a short way along +/−v, drops/climbs vertically,
    // then runs along v into its tank port. Elbow x-positions are built
    // from the same axis constants, so the vertical legs stay vertical
    // under any camera.
    var p0 = ports[0], p1 = ports[1];
    var hpSup = P(h0[0],h0[1], Hp.D, Hp.L, 52);
    var hpRet = P(h0[0],h0[1], Hp.D, Hp.L, 44);
    var supE1 = [px(hpSup[0] + 0.105*PROJ.vx), px(hpSup[1] + 0.105*PROJ.vy*PROJ.tilt)];
    var supE2 = [px(p0[0] - 0.5*PROJ.vx), px(p0[1] - 0.5*PROJ.vy*PROJ.tilt)];
    var dSup = 'M' + hpSup.join(',') + ' L' + supE1.join(',') + ' L' + supE1[0] + ',' + supE2[1] + ' L' + p0.join(',');
    var retE1 = [px(p1[0] - 0.5175*PROJ.vx), px(p1[1] - 0.5175*PROJ.vy*PROJ.tilt)];
    var retE2 = [px(hpRet[0] + 0.21*PROJ.vx), px(hpRet[1] + 0.21*PROJ.vy*PROJ.tilt)];
    var dRet = 'M' + p1.join(',') + ' L' + retE1.join(',') + ' L' + retE1[0] + ',' + retE2[1] + ' L' + hpRet.join(',');
    s += '<g>';
    s += '<path fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" d="' + dSup + '"/>';
    s += '<path fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" d="' + dRet + '"/>';
    s += '<circle cx="' + hpSup[0] + '" cy="' + hpSup[1] + '" r="1.8" fill="#0a0a0a" stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/>';
    s += '<circle cx="' + hpRet[0] + '" cy="' + hpRet[1] + '" r="1.8" fill="#0a0a0a" stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/>';
    s += '</g>';
    s += '<g id="g-flow-hp" style="opacity:0">';
    s += '<path class="flow-line" style="stroke:var(--flow-hp)" d="' + dSup + '"/>';
    s += '<path class="flow-line flow-delay-2" style="stroke:var(--flow-hp);opacity:0.7" d="' + dRet + '"/>';
    s += '</g>';

    document.getElementById('plant').innerHTML = s;
    // Occluded home-ring seam leg ends at the return riser foot. This path
    // lives INSIDE the squash wrapper, so its endpoint uses the raw
    // (unsquashed) seam equation at the riser's x.
    var seam = document.getElementById('flow-home-seam');
    if (seam) seam.setAttribute('d', 'M699,217 L' + rs1[0] + ',' + px(seamYRaw(rs1[0])));
  }

  // One camera for the whole scene: the backdrop's squash wrapper scales
  // with tilt (an approximation for the hand-drawn house — its verticals
  // compress with tilt), while the plant re-projects exactly (its verticals
  // follow rise; rise stays plant-only).
  function applyCamera() {
    var sq = document.getElementById('scene-squash');
    if (sq) sq.setAttribute('transform', 'translate(0,374.8) scale(1,' + PROJ.tilt.toFixed(4) + ') translate(0,-374.8)');
    buildPlant();
  }
  applyCamera();

  // ════════════════════════════════════════════════════════════════════
  //  STATE — production bridge (postMessage) + optional test harness
  // ════════════════════════════════════════════════════════════════════
  var MODES = ['charging','discharging','direct','maxheat','idle'];
  var TODS  = ['day','dawn','dusk','night'];
  var WXS   = ['clear','partly','overcast','rain','storm'];
  var state = {
    mode: MODES.includes(params.get('mode')) ? params.get('mode') : 'idle',
    tod: 'day', wx: 'clear', outdoor: null, sunManual: null
  };
  // Test panel: on by default when opened STANDALONE (this is the design
  // playground); hidden when embedded as the dashboard iframe. Override
  // either way with ?test=1 / ?test=0.
  var testing = params.get('test') === '1' ||
    (window.parent === window && params.get('test') !== '0');
  if (testing) document.body.classList.add('testing');

  function show(id, on) { var el = document.getElementById(id); if (el) el.style.opacity = on ? '1' : '0'; }
  function setHidden(id, hidden) { var el = document.getElementById(id); if (el) el.classList.toggle('hide', hidden); }

  // Mode colours = the shared TD palette (see :root).
  // See docs/flow-scene-truth-table.md — every wire mode maps to one of these.
  // "Bypassed" is the load-bearing word: in Direct Heat the water routes
  // THROUGH the store (so the pipe is drawn) but the store is not being fed
  // (so it does not glow). Max Heat is the contrast — house and store both.
  var COPY = {
    charging:    { label: 'Charging',    color: 'var(--charge)',          hpOn: true,  battery: 'Charging'  },
    discharging: { label: 'Discharging', color: 'var(--discharge)',       hpOn: false, battery: 'Releasing' },
    direct:      { label: 'Direct Heat', color: 'var(--direct)',          hpOn: true,  battery: 'Bypassed'  },
    maxheat:     { label: 'Max Heat',    color: 'var(--charge)',          hpOn: true,  battery: 'Secondary' },
    idle:        { label: 'Idle',        color: 'rgba(255,255,255,0.5)',  hpOn: false, battery: 'Idle'      }
  };
  // Warm windows need BOTH conditions: the house is being fed, and it is dark
  // enough for interior light to read as light. Called from applyMode() and
  // from the time-of-day path, since either can change the answer.
  function applyHouseWarmth() {
    var m = state.mode;
    var fed = m === 'discharging' || m === 'direct' || m === 'maxheat';
    var dark = state.tod === 'dusk' || state.tod === 'night';
    document.body.classList.toggle('house-warm', fed && dark);
  }

  function applyMode() {
    var d = COPY[state.mode] || COPY.idle;
    var mode = state.mode;
    var direct = mode === 'direct';
    var maxheat = mode === 'maxheat';
    // Three independent facts, not one boolean. Conflating them is what made
    // Direct Heat look like charging.
    var feedsHouse  = mode === 'discharging' || direct || maxheat;
    var pipeToStore = mode === 'charging' || direct || maxheat;  // water routed through it
    var feedsStore  = mode === 'charging' || maxheat;            // actually charging it
    var hpDrivesHouse = direct || maxheat;                       // heat is the HP's, not the store's

    ['g-flow-home', 'g-flow-home-2'].forEach(function (id) {
      var g = document.getElementById(id);
      if (!g) return;
      g.style.opacity = feedsHouse ? '1' : '0';
      g.style.setProperty('--flow-main', hpDrivesHouse ? 'var(--direct)' : 'var(--discharge)');
    });
    var hpFlow = document.getElementById('g-flow-hp');
    if (hpFlow) {
      hpFlow.style.opacity = pipeToStore ? '1' : '0';
      // Charge colour only when the store is genuinely being fed; in Direct
      // Heat the pipe carries the direct colour so it never reads as a charge.
      hpFlow.style.setProperty('--flow-hp', feedsStore ? 'var(--charge)' : 'var(--direct)');
    }
    show('hp-ring-1', d.hpOn); show('hp-ring-2', d.hpOn); show('hp-off-overlay', !d.hpOn);
    // HP accents follow the WORK it's doing: red in direct heat, orange charging.
    var hpColor = direct ? '#E3654F' : '#FF8C1A';
    ['hp-ring-1','hp-ring-2'].forEach(function (id){ var el=document.getElementById(id); if(el) el.setAttribute('stroke', hpColor); });
    ['hp-fan-1','hp-fan-2'].forEach(function (id){ var el=document.getElementById(id); if(el) el.classList.toggle('off', !d.hpOn); });
    var chip = document.getElementById('lbl-mode-chip'); if (chip){ chip.textContent = d.label; chip.setAttribute('fill', d.color); }
    var hpVal = document.getElementById('lbl-hp-val');
    if (hpVal){ hpVal.textContent = d.hpOn ? 'On' : 'Off'; hpVal.setAttribute('style', 'fill:' + (d.hpOn ? (direct ? 'var(--direct)' : 'var(--charge)') : 'rgba(255,255,255,0.4)')); }
    var bat = document.getElementById('lbl-battery-val');
    if (bat){ bat.textContent = d.battery;
      // "Bypassed" stays neutral — colouring it would imply the store is working.
      bat.setAttribute('style', feedsStore ? 'fill:var(--charge)'
        : mode==='discharging' ? 'fill:var(--discharge)' : 'fill:rgba(255,255,255,0.5)'); }
    var rad = document.getElementById('lbl-radiators-val');
    if (rad){
      if (feedsHouse){ rad.textContent='On';
        rad.setAttribute('style', hpDrivesHouse ? 'fill:var(--direct)' : 'fill:var(--discharge)'); }
      else { rad.textContent='Off'; rad.removeAttribute('style'); }
    }
    var sg = document.getElementById('store-glow-el');
    if (sg){ sg.setAttribute('fill', feedsStore ? 'url(#store-glow-c)' : 'url(#store-glow-d)');
      // Lit only when the store is a source or a destination. In Direct Heat it
      // is neither — the water merely passes through — so it stays dark.
      sg.style.opacity = (feedsStore || mode==='discharging') ? '0.55' : '0'; }
    var gr = document.getElementById('ground-reflex');
    if (gr) {
      gr.setAttribute('fill', feedsStore ? 'url(#reflex-c)' : hpDrivesHouse ? 'url(#reflex-h)' : 'url(#reflex-d)');
      gr.style.opacity = (mode === 'idle') ? '0' : '1';
    }
    applyHouseWarmth();
  }

  // ── sun arc / time of day / weather (weather-test logic) ──
  var SUN_X0 = 250, SUN_X1 = 575, SUN_Y_TOP = 22, SUN_Y_LOW = 96;
  function sunFrac() {
    if (state.sunManual != null) return state.sunManual;
    if (state.tod === 'dawn') return 0.12;
    if (state.tod === 'dusk') return 0.88;
    var d = new Date(), h = d.getHours() + d.getMinutes() / 60;
    return Math.max(0.05, Math.min(0.95, (h - 6) / 12));
  }
  function positionSun() {
    var g = document.getElementById('sky-sun');
    if (!g) return;
    var f = sunFrac(), t = 2 * f - 1;
    var x = SUN_X0 + f * (SUN_X1 - SUN_X0);
    var y = SUN_Y_TOP + (SUN_Y_LOW - SUN_Y_TOP) * (t * t);
    g.setAttribute('transform', 'translate(' + (x - 570).toFixed(1) + ',' + (y - 40).toFixed(1) + ')');
  }
  function applyTOD() {
    applyHouseWarmth();          // dusk/night is half the window-glow condition
    document.body.classList.toggle('is-night', state.tod === 'night');
    var night = state.tod === 'night';
    var f = sunFrac(), m = Math.min(f, 1 - f);
    var dusk = night ? 0 : Math.max(0, Math.min(1, 1 - (m - 0.10) / 0.15));
    document.getElementById('sky-dusk-rect').style.opacity = dusk.toFixed(2);
    document.getElementById('sky-night-rect').style.opacity = night ? '1' : '0';
    document.getElementById('sky-stars').style.opacity = night ? '1' : '0';
    document.getElementById('sky-moon').style.opacity = night ? '1' : '0';
    if (!night) positionSun();
    var disk = document.getElementById('sun-disk');
    if (disk) disk.setAttribute('fill', dusk > 0.5 ? '#E8662A' : '#FF8C1A');
    applyWX();
  }
  function applyWX() {
    var w = state.wx;
    var cloudy   = (w === 'partly' || w === 'overcast' || w === 'rain' || w === 'storm');
    var raining  = (w === 'rain' || w === 'storm');
    var storm    = (w === 'storm');
    var overcast = (w === 'overcast' || raining);
    document.getElementById('sky-clouds').style.opacity = cloudy ? '1' : '0';
    setHidden('sky-rain', !raining);
    setHidden('sky-lightning', !storm);
    document.getElementById('cloud-extra-wrap').style.opacity = overcast ? '1' : '0';
    document.querySelectorAll('#sky-clouds .cloud').forEach(function(c){
      c.setAttribute('fill', storm ? '#6f7782' : overcast ? '#838b96' : '#aab2bd');
      c.setAttribute('opacity', (parseFloat(c.dataset.op) * (storm ? 2.2 : overcast ? 1.8 : 1)).toFixed(2));
    });
    var sun = document.getElementById('sky-sun');
    if (sun) sun.style.opacity = state.tod === 'night' ? '0' : overcast ? '0.35' : '1';
    var cond = document.getElementById('lbl-outdoor-cond');
    if (cond) cond.textContent = {clear:'Clear',partly:'Partly cloudy',overcast:'Overcast',rain:'Rain',storm:'Storm'}[w] || '';
  }
  function applyOutdoor() {
    var el = document.getElementById('lbl-outdoor-temp');
    if (el) el.textContent = (state.outdoor == null || isNaN(state.outdoor)) ? '—' : state.outdoor.toFixed(1) + '°C';
    var r = document.getElementById('temp-readout');
    if (r && state.outdoor != null) r.textContent = Math.round(state.outdoor) + '°C';
  }
  function setTemp(id, val, forceMuted) {
    var el = document.getElementById(id);
    if (!el) return;
    var n = (val == null) ? NaN : parseFloat(val);
    if (forceMuted || isNaN(n)) { el.textContent = '—'; el.classList.add('muted'); }
    else { el.textContent = n.toFixed(1) + '°C'; el.classList.remove('muted'); }
  }

  // ── production bridge — same protocol as v1 (thermal-dawn-branding.js) ──
  window.addEventListener('message', function(e) {
    if (!e.data) return;
    if (e.data.type === 'setMode' && MODES.includes(e.data.mode)) { state.mode = e.data.mode; applyMode(); }
    if (e.data.type === 'setTemps') {
      setTemp('lbl-battery-temp', e.data.tank, false);
      setTemp('lbl-hp-temp',      e.data.supply, e.data.supply == null);
      setTemp('lbl-radiators-temp', e.data.living, false);
    }
    if (e.data.type === 'setEnv') {
      if (TODS.includes(e.data.tod)) state.tod = e.data.tod;
      if (WXS.includes(e.data.wx))   state.wx  = e.data.wx;
      if ('outdoor' in e.data) state.outdoor = (e.data.outdoor == null ? null : parseFloat(e.data.outdoor));
      applyTOD(); applyOutdoor();
    }
  });
  if (window.parent !== window) {
    try { window.parent.postMessage({ type: 'thermalDawnReady' }, '*'); } catch (err) {}
  }

  // ── test panel wiring (inert unless ?test=1 shows it) ──
  function syncButtons() {
    document.querySelectorAll('#test-panel button').forEach(function(b){
      b.classList.remove('active');
      if (b.dataset.tod === state.tod) b.classList.add('active');
      if (b.dataset.wx === state.wx) b.classList.add('active');
      if (b.dataset.mode === state.mode) b.classList.add('active');
    });
  }
  document.getElementById('test-panel').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.tod)  { state.tod = b.dataset.tod; state.sunManual = null; applyTOD(); }
    if (b.dataset.wx)   { state.wx = b.dataset.wx; applyWX(); }
    if (b.dataset.mode) { state.mode = b.dataset.mode; applyMode(); }
    syncButtons();
  });
  document.getElementById('tod-slider').addEventListener('input', function(){
    var f = this.value / 100;
    state.sunManual = f;
    state.tod = f < 0.12 ? 'dawn' : (f > 0.88 ? 'dusk' : 'day');
    applyTOD(); syncButtons();
  });
  function camInput() {
    PROJ.tilt = document.getElementById('tilt-slider').value / 100;
    PROJ.rise = document.getElementById('rise-slider').value / 100;
    document.getElementById('cam-readout').textContent = PROJ.tilt.toFixed(2) + ' / ' + PROJ.rise.toFixed(2);
    applyCamera();
    applyMode(); // re-wire generated flow groups
  }
  document.getElementById('tilt-slider').addEventListener('input', camInput);
  document.getElementById('rise-slider').addEventListener('input', camInput);
  document.getElementById('tilt-slider').value = PROJ.tilt * 100;
  document.getElementById('rise-slider').value = PROJ.rise * 100;
  document.getElementById('cam-readout').textContent = PROJ.tilt.toFixed(2) + ' / ' + PROJ.rise.toFixed(2);

  applyMode(); applyTOD(); applyWX(); applyOutdoor(); syncButtons();
  setInterval(function(){ if (state.tod !== 'night') positionSun(); }, 60000);
})();
</script>
</body>
</html>
